name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The default GITHUB_TOKEN can't trigger other workflows (GitHub's
          # loop-prevention for the built-in token), so a release created
          # with it would silently NOT trigger publish.yml's npm publish.
          # Add a fine-grained PAT scoped to this repo (Contents: write,
          # Pull requests: write) as a secret named RELEASE_PLEASE_TOKEN to
          # fix that. Falls back to GITHUB_TOKEN if unset -- release/PR
          # creation still works, just without triggering publish.yml.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
